# Site nginx pour STRIKEPOINT. Remplacer jeu.example.com par votre domaine.
# Copier dans /etc/nginx/sites-available/strikepoint, lier dans sites-enabled,
# puis `sudo nginx -t && sudo systemctl reload nginx` et `sudo certbot --nginx -d jeu.example.com`
# (certbot ajoute lui-même le bloc HTTPS et la redirection).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name jeu.example.com;

    client_max_body_size 1m;

    # Assets volumineux : cache navigateur long
    location /assets/ {
        proxy_pass http://127.0.0.1:8081;
        expires 7d;
        add_header Cache-Control "public";
    }

    # WebSocket du multijoueur
    location /ws {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
